<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinEdge - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #EAD7CD 0%, #D8B29C 50%, #CA9980 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px 16px 100px 16px;
            color: #332319;
        }

        /* Top Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #E65100, #F57C00);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-box svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 2;
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 800;
            color: #2D1B12;
            line-height: 1.1;
        }

        .brand-text p {
            font-size: 13px;
            color: #705B50;
            margin-top: 2px;
        }

        .notification-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .notification-btn:active {
            background: #FFFFFF;
            transform: scale(0.95);
        }

        .notification-btn svg {
            width: 20px;
            height: 20px;
            stroke: #E65100;
            stroke-width: 2;
            fill: none;
        }

        /* Main Orange Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #E65100 0%, #F57C00 60%, #FB8C00 100%);
            border-radius: 24px;
            padding: 24px 20px;
            color: #FFFFFF;
            box-shadow: 0 10px 25px rgba(230, 81, 0, 0.25);
            margin-bottom: 24px;
        }

        .card-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .main-balance {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .sub-balances {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sub-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px 14px;
        }

        .sub-box-label {
            font-size: 12px;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .sub-box-val {
            font-size: 18px;
            font-weight: 800;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.18);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-action:active,
        .btn-action.active-press {
            background: #FFFFFF !important;
            color: #E65100 !important;
            transform: scale(0.96);
        }

        .btn-action svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
            fill: none;
            stroke: currentColor;
        }

        /* Quick Actions Section */
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .section-pill {
            width: 6px;
            height: 18px;
            background-color: #E65100;
            border-radius: 4px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #5C4A40;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .quick-item {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #2D1B12;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            gap: 10px;
            transition: all 0.2s ease;
        }

        .quick-item:active,
        .quick-item.active-press {
            background: #FFFFFF !important;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            transform: scale(0.95);
        }

        .quick-item svg {
            width: 22px;
            height: 22px;
            stroke: #E65100;
            stroke-width: 2;
            fill: none;
        }

        .quick-item span {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        /* Floating Bottom Nav */
        .bottom-nav-container {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: center;
            z-index: 1000;
        }

        .bottom-nav {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-decoration: none;
            color: #6D584C;
            font-size: 11px;
            font-weight: 600;
            gap: 3px;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke: #6D584C;
            stroke-width: 2;
            fill: none;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #E65100, #F57C00);
            color: #FFFFFF;
            border-radius: 25px;
            padding: 8px 16px;
            flex: 1.2;
            flex-direction: row;
            gap: 8px;
        }

        .nav-item.active svg {
            stroke: #FFFFFF;
        }

        .nav-item.active span {
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <div class="brand-container">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg>
            </div>
            <div class="brand-text">
                <h1>FinEdge</h1>
                <p>Automatic daily income every 24h</p>
            </div>
        </div>
        <a href="#" class="notification-btn">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </a>
    </div>

    <!-- Main Balance Card -->
    <div class="balance-card">
        <div class="card-label">Account Balance</div>
        <div class="main-balance">UGX 5,000</div>
        
        <div class="sub-balances">
            <div class="sub-box">
                <div class="sub-box-label">Deposit balance</div>
                <div class="sub-box-val">UGX 0</div>
            </div>
            <div class="sub-box">
                <div class="sub-box-label">Total earned</div>
                <div class="sub-box-val">UGX 0</div>
            </div>
        </div>

        <div class="card-actions">
            <a href="deposit.html" class="btn-action">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                Deposit
            </a>
            <a href="withdraw.html" class="btn-action">
                <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                Withdraw
            </a>
        </div>
    </div>

    <!-- Quick Actions Grid -->
    <div class="section-header">
        <div class="section-pill"></div>
        <div class="section-title">Quick Actions</div>
    </div>

    <div class="quick-grid">
        <a href="deposit.html" class="quick-item">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
            <span>Deposit</span>
        </a>
        <a href="withdraw.html" class="quick-item">
            <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            <span>Withdraw</span>
        </a>
        <a href="plans.html" class="quick-item">
            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
            <span>My Plans</span>
        </a>
        <a href="team.html" class="quick-item">
            <svg viewBox="0 0 24 24"><path d="M20 12v10H4V12"></path><path d="M2 7h20v5H2z"></path><path d="M12 22V7"></path></svg>
            <span>Invite</span>
        </a>

        <a href="withdraw.html" class="quick-item">
            <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
            <span>Income</span>
        </a>
        <a href="deposit.html" class="quick-item">
            <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M12 12h.01"></path></svg>
            <span>Deposits</span>
        </a>
        <a href="withdraw.html" class="quick-item">
            <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            <span>Payouts</span>
        </a>
        <a href="#" class="quick-item">
            <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
            <span>Support</span>
        </a>
    </div>

    <!-- Floating Navigation Bar -->
    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </a>
            <a href="plans.html" class="nav-item">
                <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Plans</span>
            </a>
            <a href="team.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Team</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </a>
        </div>
    </div>

    <script>
        const pressableItems = document.querySelectorAll('.btn-action, .quick-item');
        pressableItems.forEach(item => {
            item.addEventListener('touchstart', () => item.classList.add('active-press'));
            item.addEventListener('touchend', () => item.classList.remove('active-press'));
            item.addEventListener('mousedown', () => item.classList.add('active-press'));
            item.addEventListener('mouseup', () => item.classList.remove('active-press'));
        });
    </script>
</body>
</html>
